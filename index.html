<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="author" content="CookYourWeb" />

    <!--
      Title, description, canonical, Open Graph, Twitter and JSON-LD are NOT
      here on purpose. vite-react-ssg prerenders every route into this template
      and writes that route's own tags (src/components/Seo.tsx, src/lib/seo.ts)
      at the top of <head>. Anything static here would be duplicated.

      Google Tag Manager is not loaded here either: the AEPD requires prior
      consent for statistics cookies, so GTM is injected from src/lib/gtm.ts
      only if the user accepted.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

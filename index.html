    <!--
      Fallback estatico para bots de enlaces (WhatsApp, LinkedIn, Facebook,
      Slack, X) que NO ejecutan JS. Son los valores de la home en src/lib/seo.ts
      (un test comprueba que coinciden). data-rh="true" hace que
      react-helmet-async los sustituya en el cliente en vez de duplicarlos.
      Se puede quitar cuando haya prerenderizado.
    -->
    <meta data-rh="true" name="description" content="Automatizamos procesos, atención al cliente y ventas con IA para empresas. Auditoría gratuita de 60 minutos." />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="CookYourWebAI" />
    <meta data-rh="true" property="og:locale" content="es_ES" />
    <meta data-rh="true" property="og:title" content="Agencia de IA y automatización para empresas | CookYourWebAI" />
    <meta data-rh="true" property="og:description" content="Automatizamos procesos, atención al cliente y ventas con IA para empresas. Auditoría gratuita de 60 minutos." />
    <meta data-rh="true" property="og:image" content="https://www.cookyourwebai.es/og-cookyourwebai.png" />
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />
    <meta data-rh="true" property="og:image:alt" content="CookYourWebAI, agencia de IA y automatización" />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:image" content="https://www.cookyourwebai.es/og-cookyourwebai.png" />
    <meta data-rh="true" name="twitter:image:alt" content="CookYourWebAI, agencia de IA y automatización" />

    <!--
      Google Tag Manager NO se carga aquí a proposito.
      La AEPD exige consentimiento previo para cookies de estadistica, asi que
      GTM se inyecta desde src/lib/gtm.ts solo si el usuario lo ha aceptado.
    -->
  </head>
